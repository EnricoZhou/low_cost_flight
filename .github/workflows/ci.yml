name: CI/CD Pipeline

on:
  push:
    branches: [main, "frontend/**", "backend/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. BACKEND JOB (.NET 10, EF Core, Build & Format)
  # ==========================================
  backend:
    name: Backend (Build & Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "backend/low cost flight.csproj"

      - name: Check code formatting (dotnet format)
        run: dotnet format "backend/low cost flight.csproj" --verify-no-changes

      - name: Build backend (Release)
        run: dotnet build "backend/low cost flight.csproj" --configuration Release --no-restore

      - name: Publish backend artifact
        run: dotnet publish "backend/low cost flight.csproj" --configuration Release --no-build --output backend/publish

  # ==========================================
  # 2. FRONTEND JOB (Angular 22, Prettier, ESLint & Build)
  # ==========================================
  frontend:
    name: Frontend (Lint, Prettier & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Build Angular production bundle
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/client
          retention-days: 7

  # ==========================================
  # 3. DOCKER COMPOSE CONFIG VALIDATION
  # ==========================================
  docker-check:
    name: Docker Infrastructure Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config
